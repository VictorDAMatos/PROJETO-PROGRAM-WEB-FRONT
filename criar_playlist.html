<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SONORA - Criar Playlist</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar">
             <h1 class="sidebar-logo">SONORA</h1>
            <nav class="playlist-nav">
                <h2 class="playlist-title">PLAYLISTS</h2>
                <ul id="sidebar-playlists-list"></ul>
            </nav>
            <div class="create-playlist">
                <a href="criar_playlist.html" title="Criar nova playlist">+</a>
            </div>
        </aside>

        <div class="main-view">
            <header class="top-bar">
                 <div class="top-bar-left">
                    <a href="perfil.html" class="user-profile">
                        <img id="top-bar-profile-pic" src="assets/images/profile.jpg" alt="Foto de Perfil">
                        <span id="top-bar-username">Frey</span>
                    </a>
                </div>
                <div class="top-bar-right">
                    <button id="delete-playlist-btn" class="delete-playlist-btn">Deletar</button>
                    <a href="index.html" class="nav-icon" title="Início"><i class="fas fa-home"></i></a>
                    <a href="favoritos.html" class="nav-icon" title="Favoritos"><i class="fas fa-heart"></i></a>
                    <a href="#" class="nav-icon" title="Player"><i class="fas fa-play"></i></a>
                </div>
            </header>

            <main class="main-content">
                <header class="playlist-header-editable">
                    <label for="playlist-cover-upload" class="playlist-cover-container">
                        <img id="playlist-cover-img" src="assets/images/covers/placeholder_playlist.png" alt="Capa da Playlist" class="playlist-cover-large">
                        <div class="edit-icon"><i class="fas fa-pencil-alt"></i></div>
                        <input type="file" id="playlist-cover-upload" accept="image/*" style="display: none;">
                    </label>
                    <div class="playlist-info-editable">
                        <p>Playlist</p>
                        <input type="text" id="playlist-name-input" class="playlist-name-editable" value="Minha playlist">
                        <div class="playlist-user-info">
                            <img id="playlist-user-pic" src="assets/images/profile.jpg" alt="Foto do Utilizador">
                            <span id="playlist-user-name">Frey</span>
                        </div>
                        <div id="playlist-stats" class="playlist-stats-container">
                            <span id="playlist-duration"></span>
                            <span id="playlist-song-count"></span>
                        </div>
                    </div>
                </header>

                <div class="page-actions">
                    <button id="play-playlist-btn" class="play-btn-large">PLAY</button>
                </div>

                <section class="music-section">
                    <div id="playlist-songs-container" class="liked-songs-list"></div>
                </section>

                <section class="music-section">
                    <h2 class="section-title">Vamos encontrar algo para a sua playlist</h2>
                    <div class="search-bar-large">
                        <i class="fas fa-search"></i>
                        <input type="text" id="add-song-search-input" placeholder="Procure por músicas">
                    </div>
                    <div id="search-results-container" class="liked-songs-list"></div>
                </section>
            </main>
        </div>

        <footer class="player-bar">
            <div class="song-info">
                <img id="player-cover" src="assets/images/covers/placeholder_song.png" alt="Capa do Álbum">
                <div class="song-details">
                    <h3 id="player-title">Nome da Música</h3>
                    <p><span id="player-artist">Artista</span> • <span id="player-album">Álbum</span></p>
                </div>
            </div>
            <div class="player-controls">
                <div class="progress-section">
                    <span id="current-time">0:00</span>
                    <input type="range" id="progress-bar" class="slider" value="0" min="0" max="100">
                    <span id="duration">0:00</span>
                </div>
                <div class="buttons">
                    <button id="prev-btn" class="control-btn"><i class="fas fa-step-backward"></i></button>
                    <button id="play-pause-btn" class="control-btn play-btn"><i class="fas fa-play"></i></button>
                    <button id="next-btn" class="control-btn"><i class="fas fa-step-forward"></i></button>
                </div>
            </div>
            <div class="player-options">
                <div class="volume-container">
                    <i class="fas fa-volume-up" id="volume-icon"></i>
                    <input type="range" id="volume-slider" class="slider" min="0" max="100" value="100">
                </div>
                <button id="like-btn" class="control-btn"><i class="far fa-heart"></i></button>
                <button class="add-playlist-btn" title="Adicionar à playlist"><i class="fas fa-plus"></i></button>
            </div>
        </footer>
    </div>
    
    <audio id="audio-player"></audio>
    <script src="data.js"></script>
    <script src="player.js"></script>
    <script src="criar_playlist.js"></script>
</body>
</html>
